<!doctype html><html><head><title>Phishing Detector</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav><a href="/">Check URL</a><a href="/dashboard">Dashboard</a></nav><hr>
<h2>Phishing Website Detector</h2>
<form action="/predict" method="post">
  <input type="text" name="url" placeholder="Paste a URL, e.g. http://example.com/login" required>
  <button type="submit">Check</button>
</form>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
</body></html>
